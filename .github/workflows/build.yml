name: Build Windows EXE for LM_merge_logs_to_excel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl chardet

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name LM_merge_logs_to_excel "LM_merge_logs_to_excel.py"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LM_merge_logs_to_excel_Windows
          path: dist/LM_merge_logs_to_excel.exe
